<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#181425">
<title>REVOLUTION LEGION</title>
<meta name="description" content="Spin the rings, grow your legion. A pixel-art idle RPG where numbers explode. / リングを回すほど強くなるドット絵の放置RPG">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tamaphon098-dot.github.io/revolution-legion/">
<meta property="og:title" content="REVOLUTION LEGION">
<meta property="og:description" content="リングを回すほど強くなるドット絵の放置RPG。ブラウザですぐ遊べる / A pixel-art idle RPG you can play right in your browser">
<meta property="og:image" content="https://tamaphon098-dot.github.io/revolution-legion/store/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="fonts/dotgothic16.css">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon_app.png">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="cur"><img class="px" src="px/icon_gold.png" alt=""><span id="gold">0</span></div>
    <div class="cur hide" id="pmBox" data-f="rebirth"><span id="pm">×1</span></div>
    <div class="stage"><span id="world" class="hide"></span><small>ステージ</small><b id="stage">1</b></div>
    <button id="btnShop" class="ico-btn shop" aria-label="ショップ">店</button>
    <button id="btnMenu" class="ico-btn" aria-label="メニュー">≡</button>
  </header>

  <div id="mission" role="button">
    <div class="mtop"><span class="mid" id="mId">M01</span><span class="mname" id="mName">-</span><span class="mprog" id="mProg">0/0</span></div>
    <div class="mrew">報酬：<span id="mRew"></span><span class="mlist">▶一覧</span></div>
    <i class="mbar"><b id="mBar"></b></i>
  </div>

  <div id="chBar" class="hide" role="button"></div>
  <main id="screens">
    <section class="screen on" id="scr-battle">
      <div id="bwrap"><div id="stamp"></div><div id="dropCard" class="hide"></div><div id="tapHint" class="hint hide">TAP!</div><canvas id="bcv"></canvas><canvas id="bglow" class="glow"></canvas><div id="ename"></div></div>
      <div id="mid">
        <div class="side">
          <div class="stat"><label>攻撃</label><b id="sDps">0</b></div>
          <div class="stat"><label>回転</label><b id="sRps">0</b></div>
          <div class="stat hide" data-ring="1"><label>同期率</label><b id="sSync">0%</b></div>
        </div>
        <div id="rbox"><div id="ringHint" class="hint hide">↻ 指で回す</div><canvas id="rcv" width="176" height="176"></canvas><canvas id="rglow" class="glow" width="176" height="176"></canvas></div>
        <div class="side right">
          <button id="burst" class="hide" data-f="burst"><span>BURST</span><i><b id="burstBar"></b></i></button>
          <button id="btnFast" class="small-btn">×1</button>
          <button id="btnAutoBuy" class="small-btn hide">自動強化</button>
          <button id="btnFlux" class="small-btn hide">倍速</button>
        </div>
      </div>
      <div id="rows"></div>
    </section>

    <section class="screen" id="scr-heroes"><div id="raidBox"></div><h2>軍団</h2><p class="note">各リングに置く英雄を選ぶ。英雄でリングの動きが変わる。</p><div id="heroList"></div></section>
    <section class="screen" id="scr-dex"><h2>図鑑 <small id="dexCount">0/32</small></h2><p class="note" id="dexNote"></p><div id="dexGrid"></div><div id="dexInfo" class="panel"></div></section>
    <section class="screen" id="scr-lab"><h2>リングラボ</h2><canvas id="lcv" width="144" height="144"></canvas><p class="note">速度比を 1:2 や 1:2:4 にすると発動点が重なり、同期コンボが出る。</p><div id="labRows"></div></section>
    <section class="screen" id="scr-cosmos"><h2>宇宙</h2><div id="cosBody"></div></section>
    <section class="screen" id="scr-rebirth"><canvas id="tcv" width="360" height="110"></canvas><div id="rbBody"></div></section>
  </main>

  <nav id="nav">
    <button class="on" data-s="battle"><img class="px" src="px/nav_battle.png" alt=""><span>バトル</span></button>
    <button data-s="heroes" data-f="heroes" class="hide"><img class="px" src="px/nav_hero.png" alt=""><span>軍団</span></button>
    <button data-s="dex" data-f="items" class="hide"><img class="px" src="px/icon_chest.png" alt=""><span>図鑑</span><i class="badge hide" id="dexBadge"></i></button>
    <button data-s="lab" data-f="lab" class="hide"><img class="px" src="px/nav_lab.png" alt=""><span>ラボ</span></button>
    <button data-s="rebirth" data-f="rebirth" class="hide"><img class="px" src="px/nav_rebirth.png" alt=""><span>転生</span></button>
    <button data-s="cosmos" data-f="minerals" class="hide"><img class="px" src="px/icon_core.png" alt=""><span>宇宙</span></button>
  </nav>

  <div id="toast"></div>
  <div id="modal" class="hide"><div id="mbox" class="panel"></div></div>
</div>
<script type="module" src="js/boot.js"></script>
</body>
</html>
